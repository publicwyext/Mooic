name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 2.0.5)'
        required: true
        default: '2.0.5'
      version_code:
        description: 'Version code (integer)'
        required: true
        default: '5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK
        run: |
          # Override version from workflow inputs
          sed -i "s/versionCode = .*/versionCode = ${{ inputs.version_code }}/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"${{ inputs.version_name }}\"/" app/build.gradle.kts
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: Mooic ${{ inputs.version_name }}
          body: |
            ## Mooic ${{ inputs.version_name }}

            - **Unsigned** release APK (no keystore provided in CI)
            - Built with GitHub Actions
            - versionCode: ${{ inputs.version_code }}

            > 安裝前請自行簽名，或使用 `apksigner` / Android Studio 簽名後再安裝。
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
